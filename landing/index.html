<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var stored = null;
        try {
          stored = localStorage.getItem("mehh-theme");
        } catch (e) {}
        var theme = stored === "dark" ? "dark" : "light";
        if (meta) meta.setAttribute("content", theme);
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
    <link rel="icon" type="image/png" href="/karma-mark.png" />
    <title>Mehhcode — Rust Terminal Coding Agent &amp; Karma Tech Project</title>
    <meta
      name="description"
      content="Mehhcode (mehh) is an open-source Rust terminal coding agent featuring keyless Mehh Search metasearch, QuickJS codemode, BM25 deferred MCP discovery, and a 5-layer workspace architecture, alongside Kbrowser, Optimum-Geogebra, and Karma Launcher."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
