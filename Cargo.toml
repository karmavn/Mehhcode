[workspace]
resolver = "2"
members = [
    "crates/mehh-ai",
    "crates/mehh-agent",
    "crates/mehh-tools",
    "crates/mehh-coding-agent",
    "crates/mehh-tui",
    "crates/mehh-mcp",
    "crates/mehh-codemode",
    "crates/mehh-execpolicy",
    "crates/mehh-sandbox",
    "crates/mehh-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "net", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
base64 = "0.22"
sha2 = "0.10"
regex = "1"
globset = "0.4"
ignore = "0.4"
similar = "2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
unicode-width = "0.2"
unicode-segmentation = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }

mehh-ai = { path = "crates/mehh-ai" }
mehh-agent = { path = "crates/mehh-agent" }
mehh-tools = { path = "crates/mehh-tools" }
mehh-coding-agent = { path = "crates/mehh-coding-agent" }
mehh-tui = { path = "crates/mehh-tui" }
mehh-mcp = { path = "crates/mehh-mcp" }
mehh-codemode = { path = "crates/mehh-codemode" }
mehh-execpolicy = { path = "crates/mehh-execpolicy" }
mehh-sandbox = { path = "crates/mehh-sandbox" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
